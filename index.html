<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Attendance</title>
<meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-decor"></div>

  <div class="app">
    <!-- ============ HEADER ============ -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">⏱</div>
        <div>
          <h1>Attendance</h1>
          <p id="dateLabel" class="subtle">—</p>
        </div>
      </div>
      <div class="clock" id="clock">--:--:--</div>
    </header>

    <!-- ============ TABS ============ -->
    <nav class="tabs">
      <button class="tab active" data-tab="employee">Employee</button>
      <button class="tab" data-tab="admin">Admin</button>
    </nav>

    <!-- ============ EMPLOYEE VIEW ============ -->
    <section id="view-employee" class="view active">

      <!-- Staff PIN gate -->
      <div id="staffLogin" class="glass-card">
        <label for="staffPinInput">Enter staff PIN to continue</label>
        <div class="pin-row">
          <input type="password" id="staffPinInput" inputmode="numeric" placeholder="••••" maxlength="12" />
          <button id="staffPinSubmit" class="primary-btn">Unlock</button>
        </div>
        <p id="staffPinError" class="error-msg"></p>
      </div>

      <!-- Punch dashboard -->
      <div id="employeeDashboard" class="glass-card hidden">
        <label for="personnel">Who are you?</label>
        <div class="select-wrap">
          <select id="personnel">
            <option value="">Loading personnel…</option>
          </select>
        </div>

        <div class="button-grid">
          <button class="punch-btn in am" data-type="timeInAM">
            <span class="icon">→</span>
            <span class="label">Time In</span>
            <span class="tag">AM</span>
          </button>
          <button class="punch-btn out am" data-type="timeOutAM">
            <span class="icon">←</span>
            <span class="label">Time Out</span>
            <span class="tag">AM</span>
          </button>
          <button class="punch-btn in pm" data-type="timeInPM">
            <span class="icon">→</span>
            <span class="label">Time In</span>
            <span class="tag">PM</span>
          </button>
          <button class="punch-btn out pm" data-type="timeOutPM">
            <span class="icon">←</span>
            <span class="label">Time Out</span>
            <span class="tag">PM</span>
          </button>
        </div>

        <div id="status" class="status-msg"></div>

        <div id="todaySummary" class="today-summary"></div>
      </div>
    </section>

    <!-- ============ ADMIN VIEW ============ -->
    <section id="view-admin" class="view">

      <!-- PIN gate -->
      <div id="adminLogin" class="glass-card">
        <label for="pinInput">Admin PIN</label>
        <div class="pin-row">
          <input type="password" id="pinInput" inputmode="numeric" placeholder="••••" maxlength="12" />
          <button id="pinSubmit" class="primary-btn">Unlock</button>
        </div>
        <p id="pinError" class="error-msg"></p>
      </div>

      <!-- Admin dashboard -->
      <div id="adminDashboard" class="glass-card hidden">
        <div class="admin-header">
          <div>
            <label for="dateInput">Viewing date</label>
            <input type="date" id="dateInput" />
          </div>
          <div>
            <label for="nameFilter">Find a person</label>
            <input type="text" id="nameFilter" placeholder="Type a name…" />
          </div>
          <div class="admin-stats" id="adminStats"></div>
        </div>

        <div class="table-wrap">
          <table id="adminTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>In AM</th>
                <th>Out AM</th>
                <th>In PM</th>
                <th>Out PM</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
          </table>
        </div>

        <div class="admin-footer">
          <button id="lockBtn" class="ghost-btn">🔒 Lock admin</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span id="connDot" class="conn-dot"></span>
      <span id="connLabel">Checking connection…</span>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
